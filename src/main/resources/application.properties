# 1. APPLICATION DETAILS
spring.application.name=facebookapi
server.port=${PORT:8080}

# 2. POSTGRES DATASOURCE CONFIGURATION
# DAPAT ITONG MAY DEFAULT VALUE, kahit na ito ay empty o placeholder,
# para maiwasan ang error sa literal na ${DATABASE_URL}
# Ang : (colon) ay nagsisilbing separator ng variable at default value.
spring.datasource.url=${DATABASE_URL:} 
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA/HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. OPTIONAL: CONNECTION POOL SETTINGS (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000