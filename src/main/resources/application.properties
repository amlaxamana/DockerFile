# 1. APPLICATION DETAILS
spring.application.name=facebookapi
server.port=${PORT:8080}

# 2. POSTGRES DATASOURCE CONFIGURATION
# Gumamit ng Environment Variables na sineset sa Render
# Ang DEFAULT value (hal. jdbc:postgresql://localhost:5432/db_fb) ay gagamitin lang kapag LOCAL ang pag-run.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA/HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Mahalaga: Sa production, dapat mong iwasan ang 'update' sa ddl-auto.
# Gamitin ang 'none' para protektahan ang data, o 'validate' para mag-check ng schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. OPTIONAL: CONNECTION POOL SETTINGS (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000